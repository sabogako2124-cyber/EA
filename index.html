
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Portal - STI Global City</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="logo">☕</div>
            <div>
                <strong>CAFE PORTAL</strong>
                <small>STI Global City</small>
            </div>
        </div>

        <nav>
            <button class="nav-link active" data-page="home">⌂ Home</button>
            <button class="nav-link" data-page="cart">♧ Cart <span id="cart-count">0</span></button>
            <button class="nav-link" data-page="orders">▤ Orders</button>
            <button class="nav-link" data-page="alerts">♧ Alerts</button>
            <button class="nav-link" data-page="profile">♙ Profile</button>
        </nav>

        <div class="user">
            <div class="avatar">JD</div>
            <div>
                <strong id="side-name">Juan</strong>
                <small>Student</small>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="hero" id="home-hero">
            <div class="greeting">
                <p>Good day,</p>
                <h1 id="greeting-name">Juan 👋</h1>
            </div>

            <label class="search">
                <span>⌕</span>
                <input type="search" id="search"
                    placeholder="Search food or category...">
            </label>

            <div class="categories">
                <button class="category active" data-category="All">🍴 All</button>
                <button class="category" data-category="Best Sellers">🏆 Best Sellers</button>
                <button class="category" data-category="Combo">🍱 Combo</button>
                <button class="category" data-category="Desserts">🍰 Desserts</button>
                <button class="category" data-category="Promos">🏷️ Promos</button>
                <button class="category" data-category="Drinks">🥤 Drinks</button>
                <button class="category" data-category="Others">🍽️ Others</button>
            </div>
        </header>

        <section id="home-page" class="page">
            <div class="section-head">
                <h2>ALL ITEMS</h2>
                <span id="item-total">0 items</span>
            </div>
            <div id="product-grid" class="product-grid"></div>
        </section>

        <section id="cart-page" class="page hidden">
            <h2>YOUR CART</h2>
            <div class="panel">
                <div id="cart-items"></div>
                <label class="customer-label">
                    Your name
                    <input id="customer-name" value="Juan">
                </label>
                <h3>Total: <span id="cart-total">₱0</span></h3>
                <button id="checkout-btn" class="primary">
                    Place Order
                </button>
            </div>
        </section>

        <section id="orders-page" class="page hidden">
            <h2>MY ORDERS</h2>
            <div id="orders-list" class="panel">No orders yet.</div>
        </section>

        <section id="alerts-page" class="page hidden">
            <h2>ALERTS</h2>
            <div class="panel">
                <p>🔔 Welcome to Cafe Portal!</p>
                <p>📢 Check your cart before placing an order.</p>
            </div>
        </section>

        <section id="profile-page" class="page hidden">
            <h2>PROFILE</h2>
            <div class="panel">
                <label class="customer-label">
                    Full name
                    <input id="profile-name" value="Juan">
                </label>
                <button id="save-profile" class="primary">
                    Save Profile
                </button>
            </div>
        </section>

        <footer>CAFE PORTAL · STI Global City</footer>
    </main>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
