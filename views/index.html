<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
			<meta name="viewport"
				  content="width=device-width, initial-scale=1.0">

				<title>Café Portal | STI Global City</title>

				<link rel="stylesheet" href="../public/css/style.css">
</head>

	<body>

		<main class="login-container">

			<!-- LEFT PANEL -->
			<section class="login-left">

				<div class="brand-content">

					<div class="logo-box">
						☕
					</div>

					<h1>CAFÉ PORTAL</h1>

					<h3>STI College Global City</h3>

					<p>
						Your all-in-one digital cafeteria — browse the menu,
						<br>
                    place orders, and pay seamlessly.
                </p>

				</div>

			</section>

			<!-- RIGHT PANEL -->
			<section class="login-right">

				<div class="login-form-container">

					<h2>Welcome back!</h2>

					<p class="login-subtitle">
						Sign in to your STI account to continue.
					</p>

					<form id="login-form">

						<div class="form-group">

							<label for="email">EMAIL</label>

							<input
								type="email"
								id="email"
								name="email"
								placeholder="Enter your STI email"
								autocomplete="username"
								required=""
                        >

							</div>

						<div class="form-group">

							<label for="password">PASSWORD</label>

							<input
								type="password"
								id="password"
								name="password"
								placeholder="Enter your password"
								autocomplete="current-password"
								required=""
                        >

							</div>

						<button type="submit" class="login-button">
							Log In
						</button>

						<p id="login-error" class="login-error"
						   role="alert" aria-live="polite"></p>

					</form>

					<p class="login-note">
						Use your assigned Café Portal account credentials.
						<br>
                    Only authorized STI users may access this system.
                </p>

				</div>

			</section>

		</main>
		<script type="module" src="../public/js/auth.js"></script>
	</body>
</html>
